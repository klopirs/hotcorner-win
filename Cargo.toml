[package]
name = "hotcorner-win"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics",
    "Win32_Graphics_Gdi",
    "Win32_System",
    "Win32_System_Shutdown",
] }

eframe = "0.33"
egui = "0.33"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tray-icon = "0.21"